name: Deploy Beautiful UI

on:
  push:
    branches: [main]
    paths:
      - "beautiful-ui/**"
      - ".github/workflows/deploy-beautiful-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-beautiful-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: beautiful-ui/pnpm-lock.yaml
      - name: Install and build
        working-directory: beautiful-ui
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Deploy to gh-pages branch
        run: |
          cd beautiful-ui/out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Beautiful UI from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
