name: Deploy Beautiful UI

on:
  push:
    branches: [main]
    paths:
      - "beautiful-ui-mirror/**"
      - ".github/workflows/deploy-beautiful-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-beautiful-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy mirror to gh-pages branch
        run: |
          cd beautiful-ui-mirror
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Beautiful UI mirror from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
