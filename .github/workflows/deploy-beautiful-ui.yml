name: Deploy Beautiful UI

on:
  push:
    branches: [main]
    paths:
      - "beautiful-ui/**"
      - ".github/workflows/deploy-beautiful-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-beautiful-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: beautiful-ui/pnpm-lock.yaml
      - name: Install and build
        working-directory: beautiful-ui
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: beautiful-ui/out
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
